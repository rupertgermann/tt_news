routeEnhancers:
  TtNewsDetail:
    type: Plugin
    namespace: 'tx_ttnews'
    routePath: '/{tt_news}'
    aspects:
      tt_news:
        type: PersistedAliasMapper
        tableName: tt_news
        routeFieldName: slug
    requirements:
      tt_news: '^[a-z0-9_-]+'
    defaults:
      tt_news: '0'
  TtNewsArchive:
    type: Plugin
    namespace: 'tx_ttnews'
    routePath: '/archive/{year}/{month}'
    _arguments:
      year: year
      month: month
    requirements:
      year: '\d+'
      month: '\d+'
    defaults:
      year: '0'
      month: '0'
    aspects:
      month:
        type: ArchiveValueMapper
      year:
        type: ArchiveValueMapper
  TtNewsCategory:
    type: Plugin
    namespace: 'tx_ttnews'
    routePath: '/category/{cat}'
    aspects:
      cat:
        type: PersistedAliasMapper
        tableName: tt_news_cat
        routeFieldName: uid
    defaults:
      cat: '0'
    requirements:
      cat: '[0-9]+'
  TtNewsPagination:
    type: Plugin
    namespace: 'tx_ttnews'
    routePath: '/{localized_pointer}/{pointer}'
    defaults:
      pointer: '0'
    requirements:
      pointer: '\d+'
    aspects:
      localized_pointer:
        type: LocaleModifier
        default: 'page'
        localeMap:
          - locale: 'en_GB.*'
            value: 'page'
          - locale: 'de_DE.*'
            value: 'seite'
      pointer:
        type: StaticRangeMapper
        start: '1'
        end: '100'
